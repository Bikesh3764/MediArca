services:
  - type: web
    name: mediarca-api
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Enter your Supabase pooler connection URL
      - key: DIRECT_URL
        sync: false # Enter your Supabase direct connection URL
      - key: FRONTEND_URL
        value: https://bikesh3764.github.io
