services:
  - type: web
    name: mediarca-api
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set to your live Supabase PostgreSQL URI
      - key: GOOGLE_CLIENT_ID
        sync: false # Set to your Google Cloud OAuth Client ID
      - key: FRONTEND_URL
        sync: false # Set to your live frontend URL (e.g. https://your-site.vercel.app)
