name: Final Existing Feature Hardening

on:
  push:
    branches: [audit-write-access-fixes]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !startsWith(github.event.head_commit.message, '[final-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden profile persistence and schema
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          p = Path('js/store.js')
          s = p.read_text(encoding='utf-8')
          pat = re.compile(r"  async updatePatientProfile\(profileData\) \{.*?\n  \}\n\n  async updateDoctorProfile", re.S)
          m = pat.search(s)
          if not m:
              raise SystemExit('updatePatientProfile not found')
          patient = """  async updatePatientProfile(profileData) {\n    if (!this.state.currentUser || this.state.currentUser.role !== 'patient') throw new Error('Only authenticated patients can update their profile.');\n    const userId = this.state.currentUser.id;\n    if (!window.mediarcaSupabase || !window.mediarcaSupabase.isConnected) throw new Error('Cloud database unavailable. Profile was not changed.');\n    const result = await window.mediarcaSupabase.cloudUpdatePatientProfile(userId, profileData);\n    const saved = result || {};\n    this.state.currentUser.name = saved.full_name ?? profileData.name ?? this.state.currentUser.name;\n    this.state.currentUser.phone = saved.phone ?? profileData.phone ?? this.state.currentUser.phone;\n    this.state.currentUser.age = saved.age ?? profileData.age ?? null;\n    this.state.currentUser.gender = saved.gender ?? profileData.gender ?? null;\n    this.state.currentUser.bloodGroup = saved.blood_group ?? profileData.bloodGroup ?? null;\n    this.state.currentUser.clinicalProfile = { ...(this.state.currentUser.clinicalProfile || {}), age: this.state.currentUser.age, gender: this.state.currentUser.gender, blood_group: this.state.currentUser.bloodGroup };\n    this.state.currentUser.patientProfile = { ...(this.state.currentUser.patientProfile || {}), full_name: this.state.currentUser.name, phone: this.state.currentUser.phone };\n    this.recordAuditLog({ action: 'PATIENT_PROFILE_UPDATED', entity: 'patient_clinical_profiles', entityId: userId, afterState: profileData });\n    this.saveState();\n    this.notifySubscribers();\n    return this.state.currentUser;\n  }\n\n  async updateDoctorProfile"""
          s = s[:m.start()] + patient + s[m.end():]

          q = Path('supabase_schema.sql')
          schema = q.read_text(encoding='utf-8')
          marker = '-- MEDIARCA_FINAL_HARDENING_2026_08_17'
          if marker not in schema:
              schema += """\n\n-- MEDIARCA_FINAL_HARDENING_2026_08_17\nREVOKE ALL ON FUNCTION public.issue_next_opd_token(uuid,text,varchar,varchar,integer,varchar,varchar) FROM anon;\nREVOKE ALL ON FUNCTION public.schedule_future_appointment_atomic(uuid,date,varchar,text,varchar,varchar,integer,varchar,varchar) FROM anon;\nDROP POLICY IF EXISTS \"Allow public read users\" ON public.users;\nDROP POLICY IF EXISTS \"Allow public read appointments\" ON public.appointments;\nDROP POLICY IF EXISTS \"Allow public read doctors\" ON public.doctors;\nUPDATE public.users SET password_hash=NULL WHERE password_hash IS NOT NULL;\nALTER TABLE public.users DROP COLUMN IF EXISTS password_hash;\n"""

          p.write_text(s, encoding='utf-8')
          q.write_text(schema, encoding='utf-8')
          for f in ['js/supabase_client.js','js/store.js','js/app.js','js/queue.js','js/audio.js']:
              r = subprocess.run(['node','--check',f],capture_output=True,text=True)
              if r.returncode: raise SystemExit(f'{f}: {r.stderr}')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/store.js supabase_schema.sql
          git diff --cached --check
          git commit -m "[final-hardening] make profile and schema persistence safe"
          git push origin HEAD:audit-write-access-fixes
