name: One-shot Existing Bug Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, '[one-shot-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch existing feature persistence safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('js/supabase_client.js')
          s = p.read_text(encoding='utf-8')
          pat = re.compile(r"  async cloudUpdateDoctorProfile\(doctorId, doctorData\) \{.*?\n  \}\n\n  // --- 2\. PRIVACY-SAFE", re.S)
          m = pat.search(s)
          if not m: raise SystemExit('cloudUpdateDoctorProfile not found')
          method = """  async cloudUpdateDoctorProfile(doctorId, doctorData) {\n    if (!this.client || !doctorId) throw new Error('Supabase client unavailable');\n    const authRes = await this.client.auth.getUser();\n    const authUid = authRes?.data?.user?.id;\n    if (!authUid) throw new Error('Authentication required.');\n    const updatePayload = {};\n    if (doctorData.name !== undefined) updatePayload.name = doctorData.name;\n    if (doctorData.specialty !== undefined) { updatePayload.specialty = doctorData.specialty; updatePayload.specialty_id = doctorData.specialty.toLowerCase().replace(/\\s+/g, ''); }\n    if (doctorData.title !== undefined) updatePayload.title = doctorData.title;\n    if (doctorData.degrees !== undefined) updatePayload.degrees = doctorData.degrees;\n    if (doctorData.experienceYears !== undefined) updatePayload.experience_years = parseInt(doctorData.experienceYears, 10);\n    if (doctorData.fee !== undefined) updatePayload.fee = parseFloat(doctorData.fee);\n    if (doctorData.hospital !== undefined) updatePayload.hospital = doctorData.hospital;\n    if (doctorData.schedule !== undefined) updatePayload.schedule = doctorData.schedule;\n    if (doctorData.bio !== undefined) updatePayload.bio = doctorData.bio;\n    if (doctorData.avatar !== undefined) updatePayload.avatar = doctorData.avatar;\n    if (doctorData.avgConsultTimeMins !== undefined) updatePayload.avg_consult_time_mins = parseInt(doctorData.avgConsultTimeMins, 10);\n    const { data, error } = await this.client.from('doctors').update(updatePayload).eq('id', doctorId).eq('user_id', authUid).select('*').maybeSingle();\n    if (error) throw error;\n    if (!data) throw new Error('Doctor profile update was not persisted.');\n    return data;\n  }\n\n  // --- 2. PRIVACY-SAFE"""
          s = s[:m.start()] + method + s[m.end():]
          p.write_text(s, encoding='utf-8')

          p = Path('js/store.js')
          s = p.read_text(encoding='utf-8')
          pat = re.compile(r"  async updateDoctorProfile\(doctorData\) \{.*?\n  \}\n\nasync login", re.S)
          m = pat.search(s)
          if not m: raise SystemExit('store updateDoctorProfile not found')
          method = """  async updateDoctorProfile(doctorData) {\n    if (!this.state.currentUser || this.state.currentUser.role !== 'doctor') throw new Error('Only authenticated doctors can update practice details.');\n    const docId = this.state.currentUser.doctorId;\n    if (!docId) throw new Error('Authenticated doctor profile is not linked.');\n    if (!window.mediarcaSupabase || !window.mediarcaSupabase.isConnected) throw new Error('Cloud database unavailable. Doctor profile was not changed.');\n    const saved = await window.mediarcaSupabase.cloudUpdateDoctorProfile(docId, doctorData);\n    const doc = saved || {};\n    const docIdx = this.state.doctors.findIndex(d => d.id === docId || d.userId === this.state.currentUser.id);\n    if (docIdx >= 0) {\n      this.state.doctors[docIdx] = { ...this.state.doctors[docIdx], id: doc.id ?? this.state.doctors[docIdx].id, userId: doc.user_id ?? this.state.doctors[docIdx].userId, name: doc.name ?? this.state.doctors[docIdx].name, title: doc.title ?? this.state.doctors[docIdx].title, specialty: doc.specialty ?? this.state.doctors[docIdx].specialty, specialtyId: doc.specialty_id ?? this.state.doctors[docIdx].specialtyId, degrees: doc.degrees ?? this.state.doctors[docIdx].degrees, experienceYears: doc.experience_years ?? this.state.doctors[docIdx].experienceYears, fee: doc.fee ?? this.state.doctors[docIdx].fee, hospital: doc.hospital ?? this.state.doctors[docIdx].hospital, schedule: doc.schedule ?? this.state.doctors[docIdx].schedule, bio: doc.bio ?? this.state.doctors[docIdx].bio, avatar: doc.avatar ?? this.state.doctors[docIdx].avatar, avgConsultTimeMins: doc.avg_consult_time_mins ?? this.state.doctors[docIdx].avgConsultTimeMins };\n      if (doc.name) this.state.currentUser.name = doc.name;\n    }\n    this.recordAuditLog({ action: 'DOCTOR_PROFILE_UPDATED', entity: 'doctors', entityId: docId, afterState: doctorData });\n    this.saveState();\n    this.notifySubscribers();\n    return this.state.currentUser;\n  }\n\nasync login"""
          s = s[:m.start()] + method + s[m.end():]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate application JavaScript
        run: |
          node --check js/supabase_client.js
          node --check js/store.js
          node --check js/app.js
          node --check js/queue.js
          node --check js/audio.js
          git diff --check
      - name: Commit fixes and remove workflow
        run: |
          rm -f .github/workflows/one_shot_existing_bug_fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/supabase_client.js js/store.js .github/workflows/one_shot_existing_bug_fix.yml
          git diff --cached --check
          git commit -m "[one-shot-fix] make existing doctor profile flow server-authoritative"
          git push origin HEAD:main
