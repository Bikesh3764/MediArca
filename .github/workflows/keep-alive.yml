name: Keep Backend & Database Alive

on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 minutes to prevent Render 15-minute inactivity spin-down
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MediArca Live Backend & Supabase Database
        run: |
          echo "Pinging MediArca Healthz..."
          curl -fsSL https://mediarca-mdwk.onrender.com/healthz || true
          echo "Pinging MediArca Doctors API..."
          curl -fsSL https://mediarca-mdwk.onrender.com/api/doctors || true

