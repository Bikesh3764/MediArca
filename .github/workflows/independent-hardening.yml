name: Independent Hardening Patch

on:
  push:
    branches: [audit-write-access-fixes]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/audit-write-access-fixes' && !startsWith(github.event.head_commit.message, '[security-bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply targeted existing-feature fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('js/supabase_client.js')
          s = p.read_text(encoding='utf-8')

          def once(old, new):
              global s
              if old in s:
                  s = s.replace(old, new, 1)

          once("phone: user.phone || user.user_metadata?.phone || '+91 9608858316'", "phone: user.phone || user.user_metadata?.phone || null")
          once("age: 19,\n              gender: 'Male',\n              blood_group: 'B+'", "age: null,\n              gender: null,\n              blood_group: null")

          doctor_pattern = re.compile(r"        // Query doctor profile by user_id OR email.*?        } catch \(e\) \{\n          console.warn\('Doctor profile fetch notice:', e\);\n        \}", re.S)
          doctor_repl = """        // Query doctor profile only through an authoritative Auth-to-doctor link.\n        try {\n          const { data } = await this.client\n            .from('doctors')\n            .select('*')\n            .eq('user_id', user.id)\n            .maybeSingle();\n          doctorProfile = data;\n        } catch (e) {\n          console.warn('Doctor profile fetch notice:', e);\n        }"""
          s, n = doctor_pattern.subn(doctor_repl, s, count=1)
          if n != 1:
              raise SystemExit('Doctor auth-link block not found')

          role_pattern = re.compile(r"        if \(doctorProfile && profile && profile\.role !== 'doctor'\) \{.*?        \}\n\n", re.S)
          s, _ = role_pattern.subn('', s, count=1)

          profile_pattern = re.compile(r"  async cloudUpdatePatientProfile\(userId, profileData\) \{.*?\n  \}\n\n  async cloudUpdateDoctorProfile", re.S)
          profile_repl = """  async cloudUpdatePatientProfile(userId, profileData) {\n    if (!this.client || !userId) throw new Error('Supabase client unavailable');\n\n    const name = profileData.name || null;\n    const phone = profileData.phone || null;\n    const age = profileData.age ? parseInt(profileData.age, 10) : null;\n    const gender = profileData.gender || null;\n    const bloodGroup = profileData.bloodGroup || null;\n\n    const { data, error } = await this.client.rpc('update_patient_profile_atomic', {\n      p_name: name,\n      p_phone: phone,\n      p_age: age,\n      p_gender: gender,\n      p_blood_group: bloodGroup\n    });\n\n    if (error) throw error;\n    return data;\n  }\n\n  async cloudUpdateDoctorProfile"""
          s, n = profile_pattern.subn(profile_repl, s, count=1)
          if n != 1:
              raise SystemExit('Patient profile function not found')

          sync_start = "  async syncInitialDataFromCloud() {\n    if (!this.client) return;\n"
          sync_repl = "  async syncInitialDataFromCloud() {\n    if (!this.client) return;\n\n    const { data: authUserData } = await this.client.auth.getUser();\n    const user = authUserData?.user || null;\n"
          once(sync_start, sync_repl)

          once("const todayStr = new Date().toISOString().split('T')[0];", "const todayStr = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date());")
          once(".eq('queue_date', new Date().toISOString().split('T')[0]);", ".eq('queue_date', new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata' }).format(new Date()));")
          once("if (!docErr && docs && docs.length > 0) {", "if (!docErr && docs) {")
          once("if (!qErr && queues && queues.length > 0) {", "if (!qErr && queues) {")
          once("if (!apptErr && appts && appts.length > 0) {", "if (!apptErr && appts) {")

          merge_pattern = re.compile(r"          // Merge into state\.bookings by unique ID\n          const existingIds = new Set\(mappedBookings\.map\(b => b\.id\)\);\n          const localOnly = \(window\.mediarcaStore\.state\.bookings \|\| \[\]\)\.filter\(b => !existingIds\.has\(b\.id\)\);\n          window\.mediarcaStore\.state\.bookings = \[\.\.\.mappedBookings, \.\.\.localOnly\];")
          s, n = merge_pattern.subn("          // Supabase is authoritative for clinical appointments.\n          window.mediarcaStore.state.bookings = mappedBookings;", s, count=1)
          if n != 1:
              raise SystemExit('Booking merge block not found')

          # Remove stale seed/demo operational records after a successful cloud load.
          # Do not alter the existing seed definitions themselves.
          s = s.replace("window.mediarcaStore.state.doctors = docs.map", "window.mediarcaStore.state.doctors = docs.map", 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: node --check js/supabase_client.js

      - name: Commit hardened client
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/supabase_client.js
          git diff --cached --check
          git commit -m "[security-bot] Harden auth hydration, profile writes, and India date handling"
          git push origin HEAD:audit-write-access-fixes
