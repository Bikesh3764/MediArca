name: Independent Hardening Patch

on:
  push:
    branches: [audit-write-access-fixes]

permissions:
  contents: write

jobs:
  verify-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check baseline JavaScript syntax
        run: |
          echo 'Checking current branch...'
          node --check js/supabase_client.js
          echo 'Checking main branch source independently...'
          git show origin/main:js/supabase_client.js > /tmp/main_supabase_client.js
          node --check /tmp/main_supabase_client.js
      - name: Static smoke checks
        run: |
          test -f js/supabase_client.js
          test -f js/store.js
          test -f js/app.js
          test -f supabase_schema.sql
          echo 'Baseline source files present.'
