name: Independent Hardening Patch

on:
  push:
    branches: [audit-write-access-fixes]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/audit-write-access-fixes' && !startsWith(github.event.head_commit.message, 'chore: apply independent hardening fixes')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply targeted existing-feature fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('js/supabase_client.js')
          text = p.read_text()

          replacements = [
          ("phone: user.phone || user.user_metadata?.phone || '+91 9608858316'", "phone: user.phone || user.user_metadata?.phone || null"),
          ("""await this.client.from('patient_clinical_profiles').upsert({
              user_id: user.id,
              age: 19,
              gender: 'Male',
              blood_group: 'B+'
            }, { onConflict: 'user_id' });""", """await this.client.from('patient_clinical_profiles').upsert({
              user_id: user.id,
              age: null,
              gender: null,
              blood_group: null
            }, { onConflict: 'user_id' });"""),
          ("""const userEmail = (user.email || '').toLowerCase().trim();
          const { data } = await this.client
            .from('doctors')
            .select('*')
            .or(`user_id.eq.${user.id},email.eq.${userEmail}`)
            .maybeSingle();
          doctorProfile = data;

          if (doctorProfile && !doctorProfile.user_id) {
            await this.client
              .from('doctors')
              .update({ user_id: user.id })
              .eq('id', doctorProfile.id);
            doctorProfile.user_id = user.id;
          }""", """const { data } = await this.client
            .from('doctors')
            .select('*')
            .eq('user_id', user.id)
            .maybeSingle();
          doctorProfile = data;"""),
          ("""        if (doctorProfile && profile && profile.role !== 'doctor') {
          try {
            await this.client.from('users').update({ role: 'doctor' }).eq('id', user.id);
          } catch (rErr) {
            console.warn('Role update notice:', rErr);
          }
        }

""", """"),
          ("""    try {
      // 1. Try atomic RPC update first
      const { data, error } = await this.client.rpc('update_patient_profile_atomic', {
        p_name: name,
        p_phone: phone,
        p_age: age,
        p_gender: gender,
        p_blood_group: bloodGroup
      });

      if (!error && data) {
        return data;
      }
    } catch (rpcErr) {
      console.warn('RPC profile update fallback notice:', rpcErr);
    }

    try {
      // 2. Direct fallback updates
      const userUpdate = {};
      if (name) userUpdate.full_name = name;
      if (phone) userUpdate.phone = phone;
      if (age) userUpdate.age = age;
      if (gender) userUpdate.gender = gender;
      if (bloodGroup) userUpdate.blood_group = bloodGroup;

      await this.client.from('users').update(userUpdate).eq('id', userId);

      await this.client.from('patient_clinical_profiles').upsert({
        user_id: userId,
        age: age,
        gender: gender,
        blood_group: bloodGroup
      }, { onConflict: 'user_id' });
    } catch (fallbackErr) {
      console.warn('Direct fallback profile update notice:', fallbackErr);
    }""", """    const { data, error } = await this.client.rpc('update_patient_profile_atomic', {
      p_name: name,
      p_phone: phone,
      p_age: age,
      p_gender: gender,
      p_blood_group: bloodGroup
    });

    if (error) throw error;
    return data;"""),
          ("const todayStr = new Date().toISOString().split('T')[0];", "const todayStr = getIndiaTodayDate();"),
          (".eq('queue_date', new Date().toISOString().split('T')[0]);", ".eq('queue_date', getIndiaTodayDate());"),
          ("""          // Merge into state.bookings by unique ID
          const existingIds = new Set(mappedBookings.map(b => b.id));
          const localOnly = (window.mediarcaStore.state.bookings || []).filter(b => !existingIds.has(b.id));
          window.mediarcaStore.state.bookings = [...mappedBookings, ...localOnly];""", """          // Supabase is authoritative for clinical appointments.
          // Do not retain stale browser-only records after a successful cloud sync.
          window.mediarcaStore.state.bookings = mappedBookings;"""),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Missing expected source block: {old[:100]!r}')
              text = text.replace(old, new, 1)

          marker = "const SUPABASE_CONFIG = {"
          helper = """function getIndiaTodayDate() {
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit'
            }).formatToParts(new Date());
            const values = Object.fromEntries(parts.filter(p => p.type !== 'literal').map(p => [p.type, p.value]));
            return `${values.year}-${values.month}-${values.day}`;
          }

          """
          if helper.strip() not in text:
              text = text.replace(marker, helper + marker, 1)

          p.write_text(text)
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path('supabase_schema.sql')
          text = p.read_text()
          hardening = r'''

          -- Independent hardening baseline (2026-08-17)
          -- Keep the live database and repository behavior aligned.
          REVOKE ALL ON FUNCTION public.issue_next_opd_token(uuid,text,character varying,character varying,integer,character varying,character varying) FROM anon;
          REVOKE ALL ON FUNCTION public.schedule_future_appointment_atomic(uuid,date,character varying,text,character varying,character varying,integer,character varying,character varying) FROM anon;
          DROP FUNCTION IF EXISTS public.issue_next_opd_token(uuid,text,character varying);
          DROP FUNCTION IF EXISTS public.schedule_future_appointment_atomic(uuid,date,character varying,text,character varying);

          CREATE OR REPLACE FUNCTION public.handle_new_auth_user()
          RETURNS trigger
          LANGUAGE plpgsql SECURITY DEFINER
          SET search_path = public
          AS $$
          DECLARE
            v_role text := COALESCE(NEW.raw_user_meta_data->>'role','patient');
            v_full_name text;
            v_phone text;
          BEGIN
            IF v_role NOT IN ('patient','doctor') THEN v_role := 'patient'; END IF;
            v_full_name := COALESCE(NULLIF(trim(NEW.raw_user_meta_data->>'full_name'),''), NULLIF(trim(NEW.raw_user_meta_data->>'name'),''), split_part(COALESCE(NEW.email,''),'@',1));
            v_phone := NULLIF(trim(NEW.raw_user_meta_data->>'phone'),'');
            INSERT INTO public.users(id,email,full_name,role,phone,created_at,updated_at)
            VALUES(NEW.id,NEW.email,v_full_name,v_role,v_phone,NOW(),NOW())
            ON CONFLICT (id) DO UPDATE SET email=EXCLUDED.email, full_name=EXCLUDED.full_name, updated_at=NOW();
            IF v_role='patient' THEN
              INSERT INTO public.patient_clinical_profiles(user_id,age,gender,blood_group,created_at,updated_at)
              VALUES(NEW.id,NULL,NULL,NULL,NOW(),NOW()) ON CONFLICT(user_id) DO NOTHING;
            END IF;
            RETURN NEW;
          END;
          $$;

          DROP POLICY IF EXISTS "Allow public read users" ON public.users;
          DROP POLICY IF EXISTS "Allow public read appointments" ON public.appointments;
          DROP POLICY IF EXISTS "users_insert_own" ON public.users;
          DROP POLICY IF EXISTS "users_update_own" ON public.users;
          CREATE POLICY "users_read_own_or_admin" ON public.users FOR SELECT TO authenticated USING (id=auth.uid() OR is_admin(auth.uid()));
          CREATE POLICY "users_insert_own_authenticated" ON public.users FOR INSERT TO authenticated WITH CHECK (id=auth.uid() OR is_admin(auth.uid()));
          CREATE POLICY "users_update_own_authenticated" ON public.users FOR UPDATE TO authenticated USING (id=auth.uid() OR is_admin(auth.uid())) WITH CHECK (id=auth.uid() OR is_admin(auth.uid()));
          DROP POLICY IF EXISTS "appointments_read_owner_staff" ON public.appointments;
          CREATE POLICY "appointments_read_owner_staff" ON public.appointments FOR SELECT TO authenticated USING (patient_id=auth.uid() OR doctor_id IN (SELECT id FROM public.doctors WHERE user_id=auth.uid()) OR EXISTS (SELECT 1 FROM public.users u WHERE u.id=auth.uid() AND u.role IN ('admin','receptionist')));
          UPDATE public.users SET password_hash=NULL WHERE password_hash IS NOT NULL;
          '''
          if '-- Independent hardening baseline (2026-08-17)' not in text:
              p.write_text(text + hardening)
          PY

      - name: Commit fixes
        run: |
          git config user.name "MediArca Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/supabase_client.js supabase_schema.sql
          git diff --cached --quiet || git commit -m "chore: apply independent hardening fixes"
          git push origin HEAD:audit-write-access-fixes
