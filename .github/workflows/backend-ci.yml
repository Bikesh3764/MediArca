name: Backend CI & Verification Gate

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-verification:
    name: Backend Build & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mediarca_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mediarca_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mediarca_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mediarca_ci
      JWT_SECRET: mediarca-ci-verification-strong-jwt-secret-key-2026

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Prisma Schema
        working-directory: backend
        run: npx prisma validate

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Apply Prisma Migrations to CI PostgreSQL Database
        working-directory: backend
        run: npm run prisma:migrate:deploy

      - name: Verify Prisma Migration Status on CI PostgreSQL
        working-directory: backend
        run: npx prisma migrate status

      - name: Compile Backend TypeScript
        working-directory: backend
        run: npm run build

      - name: Execute Automated Verification Test Suite
        working-directory: backend
        run: npm run test:verify
